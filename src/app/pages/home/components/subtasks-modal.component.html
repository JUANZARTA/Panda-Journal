<div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" (click)="onCerrar()">
  <div
    class="bg-paper-raised rounded-lg shadow-page p-6 w-full max-w-md max-h-[90vh] overflow-y-auto"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-2">
        <button
          (click)="marcarTodasCompletas()"
          *ngIf="subtasks().length > 0 && !todasCompletas()"
          class="text-accent hover:text-accent/80 transition flex-shrink-0"
          title="Marcar todas como completas"
        >
          <span class="material-icons" style="font-size: 18px">done_all</span>
        </button>
        <h2 class="font-hand text-2xl text-accent">Subtareas</h2>
      </div>
      <button (click)="onCerrar()" class="text-ink-faint hover:text-ink flex-shrink-0">
        <span class="material-icons">close</span>
      </button>
    </div>

    <p class="text-sm text-ink-faint mb-4">{{ parentTask().nombre }}</p>

    <!-- Lista de subtareas -->
    <div class="space-y-2 mb-4">
      <div *ngFor="let sub of subtasks()" class="flex items-start gap-3 py-2 group">
        <button
          (click)="toggleCompleta(sub)"
          class="mt-0.5 w-5 h-5 rounded border-2 flex items-center justify-center shrink-0 transition"
          [ngClass]="sub.estado === 'realizado' ? 'bg-done border-done' : 'border-ink-faint'"
        >
          <span *ngIf="sub.estado === 'realizado'" class="material-icons text-white" style="font-size: 14px">
            check
          </span>
        </button>

        <ng-container *ngIf="editandoId() !== sub.id; else editando">
          <span
            (click)="empezarEdicion(sub)"
            class="flex-1 cursor-text text-sm break-words"
            [class.line-through]="sub.estado === 'realizado'"
            [class.text-ink-faint]="sub.estado === 'realizado'"
            [class.text-ink]="sub.estado !== 'realizado'"
          >
            {{ sub.nombre }}
          </span>
          <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition">
            <button
              (click)="moverArriba(sub)"
              [disabled]="!puedeSubir(sub)"
              class="p-1 shrink-0 disabled:opacity-30"
              title="Mover arriba"
            >
              <span class="material-icons text-ink-faint hover:text-accent" style="font-size: 14px">arrow_upward</span>
            </button>
            <button
              (click)="moverAbajo(sub)"
              [disabled]="!puedeJajar(sub)"
              class="p-1 shrink-0 disabled:opacity-30"
              title="Mover abajo"
            >
              <span class="material-icons text-ink-faint hover:text-accent" style="font-size: 14px">arrow_downward</span>
            </button>
            <button
              (click)="eliminarSubtarea(sub)"
              class="p-1 shrink-0"
              title="Eliminar"
            >
              <span class="material-icons text-ink-faint hover:text-overdue" style="font-size: 14px">close</span>
            </button>
          </div>
        </ng-container>

        <ng-template #editando>
          <input
            type="text"
            [(ngModel)]="editandoNombre"
            (keyup.enter)="guardarEdicion(sub)"
            (keyup.escape)="cancelarEdicion()"
            (blur)="guardarEdicion(sub)"
            class="flex-1 bg-transparent border-b border-accent focus:outline-none text-sm text-ink"
          />
        </ng-template>
      </div>
    </div>

    <!-- Agregar subtarea -->
    <div class="flex items-center gap-3 py-2 border-t border-paper-line pt-4 mb-4">
      <span class="w-5 h-5 flex items-center justify-center shrink-0">
        <span class="material-icons text-ink-faint" style="font-size: 16px">add</span>
      </span>
      <input
        type="text"
        [(ngModel)]="nuevoTexto"
        (keyup.enter)="agregarSubtarea()"
        placeholder="Agregar subtarea…"
        class="flex-1 bg-transparent placeholder:text-ink-faint text-ink focus:outline-none text-sm"
      />
      <button
        *ngIf="nuevoTexto()"
        (click)="agregarSubtarea()"
        class="text-xs font-semibold text-accent px-2 py-1 shrink-0"
      >
        Agregar
      </button>
    </div>

    <!-- Botón Aceptar -->
    <div class="flex gap-2 pt-4 border-t border-paper-line">
      <button
        (click)="onCerrar()"
        class="flex-1 px-3 py-2 bg-accent text-white rounded font-semibold hover:opacity-90 transition"
      >
        Aceptar
      </button>
    </div>
  </div>
</div>
