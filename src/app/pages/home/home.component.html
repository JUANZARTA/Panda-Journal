<div class="max-w-2xl mx-auto px-4 md:px-0 py-6 md:py-12">
  <!-- Encabezado de la página -->
  <div class="text-center mb-6">
    <p class="font-hand text-4xl md:text-5xl text-ink capitalize">{{ fechaLegible() }}</p>
    <button
      *ngIf="!esHoy()"
      (click)="irHoy()"
      class="mt-2 inline-flex items-center gap-2 bg-accent text-white text-sm font-semibold px-4 py-2 rounded-full shadow-page hover:opacity-90 transition"
    >
      <span class="material-icons" style="font-size: 18px">today</span>
      Volver a hoy
    </button>
  </div>

  <!-- La hoja del día -->
  <div
    class="notebook-page rounded-lg shadow-page px-5 md:px-10 py-8"
    [ngClass]="pageAnimClass()"
    (animationend)="pageAnimClass.set('')"
  >
    <ng-container *ngIf="categorias().length > 0; else sinCategorias">
      <section *ngFor="let categoria of categorias(); trackBy: trackById" class="mb-8 last:mb-0">
        <h2 class="font-hand text-2xl text-accent mb-3">{{ categoria.nombre }}</h2>

        <div
          *ngFor="let task of tareasDe(categoria.id); trackBy: trackByTaskId"
          class="flex items-start gap-3 py-1.5 group"
        >
          <button
            (click)="toggleTask(task)"
            class="mt-0.5 w-5 h-5 rounded border-2 flex items-center justify-center shrink-0 transition"
            [ngClass]="task.estado === 'realizado' ? 'bg-done border-done' : 'border-ink-faint'"
          >
            <span *ngIf="task.estado === 'realizado'" class="material-icons text-white" style="font-size: 14px">
              check
            </span>
          </button>

          <ng-container *ngIf="editandoTaskId !== task.id; else editandoTask">
            <span
              (click)="empezarEdicionTask(task)"
              class="flex-1 cursor-text break-words"
              [class.line-through]="task.estado === 'realizado'"
              [class.text-ink-faint]="task.estado === 'realizado'"
              [class.text-ink]="task.estado !== 'realizado'"
            >
              {{ task.nombre }}
            </span>
            <button
              (click)="eliminarTarea(task)"
              class="opacity-70 md:opacity-0 md:group-hover:opacity-100 transition p-1 shrink-0"
            >
              <span class="material-icons text-ink-faint hover:text-overdue" style="font-size: 16px">close</span>
            </button>
          </ng-container>

          <ng-template #editandoTask>
            <input
              type="text"
              [(ngModel)]="editandoTaskNombre"
              (keyup.enter)="guardarEdicionTask(task)"
              (keyup.escape)="cancelarEdicionTask()"
              (blur)="guardarEdicionTask(task)"
              class="flex-1 bg-transparent border-b border-accent focus:outline-none text-ink"
            />
          </ng-template>
        </div>

        <!-- Alta rápida -->
        <div class="flex items-center gap-3 py-1.5 mt-1">
          <span class="w-5 h-5 flex items-center justify-center shrink-0">
            <span class="material-icons text-ink-faint" style="font-size: 16px">add</span>
          </span>
          <input
            type="text"
            [(ngModel)]="nuevoTaskTexto[categoria.id]"
            (keyup.enter)="agregarTarea(categoria.id)"
            placeholder="Agregar tarea…"
            class="flex-1 bg-transparent placeholder:text-ink-faint text-ink focus:outline-none"
          />
        </div>
      </section>
    </ng-container>

    <ng-template #sinCategorias>
      <div class="text-center py-10">
        <p class="text-ink-soft mb-3">Todavía no tenés categorías en tu cuaderno.</p>
        <a routerLink="/app/categorias" class="text-accent font-semibold underline">Creá la primera</a>
      </div>
    </ng-template>
  </div>

  <!-- Progreso del día -->
  <div *ngIf="hayTareasHoy()" class="mt-4 px-1">
    <div class="h-1.5 rounded-full bg-paper-line overflow-hidden">
      <div
        class="h-full bg-done rounded-full transition-all duration-500"
        [style.width.%]="progresoDia()"
      ></div>
    </div>
  </div>

  <!-- Navegación de días, al pie de la página -->
  <div class="flex items-center justify-center gap-6 mt-8">
    <button
      (click)="irDiaAnterior()"
      class="p-2 rounded-full hover:bg-accent-soft/60 transition"
      aria-label="Día anterior"
    >
      <span class="material-icons text-ink">chevron_left</span>
    </button>
    <span class="text-sm text-ink-faint">{{ selectedDate() }}</span>
    <button
      (click)="irDiaSiguiente()"
      class="p-2 rounded-full hover:bg-accent-soft/60 transition"
      aria-label="Día siguiente"
    >
      <span class="material-icons text-ink">chevron_right</span>
    </button>
  </div>
</div>
