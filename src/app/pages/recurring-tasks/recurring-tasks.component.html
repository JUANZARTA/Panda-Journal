<div class="max-w-2xl mx-auto px-5 py-8 md:py-12">
  <h1 class="font-hand text-4xl text-ink mb-1">Tareas Recurrentes</h1>
  <p class="text-sm text-ink-soft mb-8">Se crean automáticamente en tu cuaderno cada día.</p>

  <div class="bg-paper-raised rounded-lg border border-paper-line p-5 mb-6">
    <h2 class="font-semibold text-ink mb-4">Crear nueva tarea recurrente</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <input
        type="text"
        [(ngModel)]="nuevoNombre"
        (keyup.enter)="agregarTarea()"
        placeholder="Nombre de la tarea"
        class="px-3 py-2 text-sm border border-paper-line rounded bg-paper text-ink placeholder:text-ink-faint focus:outline-none focus:border-accent"
      />
      <select
        [(ngModel)]="categoriaSelecionada"
        class="px-3 py-2 text-sm border border-paper-line rounded bg-paper text-ink focus:outline-none focus:border-accent"
      >
        <option value="">Selecciona categoría</option>
        <option *ngFor="let cat of categories()" [value]="cat.id">{{ cat.nombre }}</option>
      </select>
      <button
        (click)="agregarTarea()"
        [disabled]="creando()"
        class="px-4 py-2 text-sm bg-accent-soft text-ink font-semibold rounded hover:opacity-90 transition disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ creando() ? 'Agregando...' : 'Agregar' }}
      </button>
    </div>
  </div>

  <div class="notebook-page rounded-lg shadow-page px-5 py-4">
    <div
      *ngFor="let task of tasks()"
      class="flex items-center gap-3 py-2.5 border-b border-paper-line last:border-0"
      [class.opacity-60]="!task.activo"
    >
      <ng-container *ngIf="editando() !== task.id; else editandoTpl">
        <div class="flex-1 min-w-0">
          <p class="text-ink truncate">{{ task.nombre }}</p>
          <p class="text-xs text-ink-faint truncate">{{ getNombreCategoria(task.categoriaId) }}</p>
        </div>

        <label class="flex items-center cursor-pointer" [title]="task.activo ? 'Desactivar' : 'Activar'">
          <input type="checkbox" [checked]="task.activo" (change)="toggleActivo(task)" class="toggle-checkbox" />
          <span class="toggle-slider"></span>
        </label>
        <button (click)="iniciarEdicion(task)" class="p-1.5 rounded hover:bg-accent-soft/60 transition" title="Editar">
          <span class="material-icons text-base text-ink-soft">edit</span>
        </button>
        <button (click)="eliminar(task.id)" class="p-1.5 rounded hover:bg-overdue/10 transition" title="Eliminar">
          <span class="material-icons text-base text-overdue">delete</span>
        </button>
      </ng-container>

      <ng-template #editandoTpl>
        <input
          type="text"
          [(ngModel)]="editNombre"
          (keyup.enter)="guardarEdicion(task.id)"
          (keyup.escape)="cancelarEdicion()"
          class="flex-1 min-w-0 bg-transparent border-b border-accent text-ink focus:outline-none py-1"
        />
        <select
          [(ngModel)]="editCategoria"
          class="bg-transparent border-b border-paper-line focus:border-accent text-sm text-ink-soft focus:outline-none py-1"
        >
          <option *ngFor="let cat of categories()" [value]="cat.id">{{ cat.nombre }}</option>
        </select>
        <button (click)="guardarEdicion(task.id)" class="p-1.5 rounded hover:bg-accent-soft/60 transition" title="Guardar">
          <span class="material-icons text-base text-done">check</span>
        </button>
        <button (click)="cancelarEdicion()" class="p-1.5 rounded hover:bg-accent-soft/60 transition" title="Cancelar">
          <span class="material-icons text-base text-ink-soft">close</span>
        </button>
      </ng-template>
    </div>

    <div *ngIf="tasks().length === 0" class="text-center text-ink-faint py-6 text-sm">
      Todavía no tenés tareas recurrentes — creá la primera arriba.
    </div>
  </div>
</div>
