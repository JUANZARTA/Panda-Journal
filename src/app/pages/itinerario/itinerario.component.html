<div class="min-h-screen bg-paper p-4 md:p-8">
  <div class="max-w-7xl mx-auto">
    <!-- Encabezado -->
    <div class="mb-8">
      <p class="font-hand text-4xl md:text-5xl text-ink">Tu Itinerario</p>
      <p class="text-sm text-ink-faint mt-2">Planifica tu semana: 24 horas × 7 días</p>
    </div>



    <!-- Layout: Grid + Panel (desktop horizontal, mobile vertical) -->
    <div class="flex flex-col lg:flex-row gap-6 lg:gap-8">
      <!-- Grid del itinerario (60-70%) -->
      <div class="flex-1 min-w-0">
        <app-schedule-grid
          [activities]="activities()"
          [blocks]="blocks()"
          [tasks]="tasks()"
          (blockCreated)="selectActivity($event)"
        />
      </div>

      <!-- Panel de actividades (30-40%) -->
      <div class="w-full lg:w-80">
        <app-activity-panel
          [activities]="activities()"
          [blocks]="blocks()"
          [selectedActivityId]="selectedActivityId()"
          (activitySelected)="selectActivity($event)"
        />
      </div>
    </div>
  </div>
</div>
