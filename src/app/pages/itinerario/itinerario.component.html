<div class="min-h-screen bg-paper p-4 md:p-8 transition-all duration-300" [style.margin-left.px]="uiState.isSidebarCollapsed() ? -208 : 0">
  <div class="mx-auto">
    <!-- Encabezado -->
    <div class="mb-8">
      <p class="font-hand text-4xl md:text-5xl text-ink">Tu Itinerario</p>
      <p class="text-sm text-ink-faint mt-2">Planifica tu semana: 24 horas × 7 días</p>
    </div>



    <!-- Layout: Grid + Panel (desktop horizontal, mobile vertical) -->
    <div class="flex flex-col lg:flex-row gap-6 lg:gap-4">
      <!-- Grid del itinerario (scrolleable en todos los tamaños) -->
      <div class="flex-1 min-w-0">
        <app-schedule-grid
          [activities]="activities()"
          [blocks]="blocks()"
          [tasks]="tasks()"
          (blockCreated)="selectActivity($event)"
        />
      </div>

      <!-- Panel de actividades (sidebar) -->
      <div class="w-full lg:w-72 lg:flex-shrink-0">
        <app-activity-panel
          [activities]="activities()"
          [blocks]="blocks()"
          [selectedActivityId]="selectedActivityId()"
          (activitySelected)="selectActivity($event)"
        />
      </div>
    </div>
  </div>
</div>
