<div class="min-h-screen flex bg-paper">
  <app-sidebar />

  <div
    class="flex-1 flex flex-col min-w-0 transition-all duration-300"
    [ngClass]="uiState.isSidebarCollapsed() ? 'md:ml-20' : 'md:ml-72'"
  >
    <app-header />
    <main class="flex-1 min-w-0">
      <router-outlet />
    </main>
  </div>
</div>

<div
  *ngIf="connection.offline()"
  class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 px-4 py-2 rounded-full bg-paper-raised border border-paper-line shadow-page text-xs text-ink-soft whitespace-nowrap"
  role="status"
>
  <span class="material-icons text-base text-overdue">cloud_off</span>
  Sin conexión · tus cambios se guardan al volver
</div>
